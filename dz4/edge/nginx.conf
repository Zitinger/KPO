worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream gateway_upstream {
    server gateway-1:8000;
  }

  # Несколько инстансов orders - для демонстрации корректной доставки WS-уведомлений
  upstream orders_upstream {
    server orders-1:8000;
    server orders-2:8000;
  }

  # Фронтенд (статическая страница с toast/Notification API)
  upstream frontend_upstream {
    server frontend:80;
  }

  server {
    listen 80;

    location = / {
      return 302 /docs;
    }

    location /docs {
      proxy_pass http://gateway_upstream;
    }

    location /ui {
      proxy_pass http://gateway_upstream;
    }

    # Фронтенд как отдельный сервис
    location = /app {
      return 302 /app/;
    }

    location /app/ {
      proxy_pass http://frontend_upstream/;
    }

    location = /openapi.json {
      proxy_pass http://gateway_upstream/openapi.json;
    }

    location /api/ {
      proxy_pass http://gateway_upstream;
    }

    location /ws/orders/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://orders_upstream;
    }
  }
}
